<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(10,114,239,0.35)"/>
      <stop offset="100%" stop-color="rgba(10,114,239,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Logo mark (Y arrow) -->
  <g transform="translate(80,200)">
    <path d="M0 70L30 0l30 70-30-14z" fill="#0A72EF"/>
    <path d="M14 70l16 22 16-22" fill="none" stroke="#0A72EF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="270" fill="#ffffff"
        font-family="Inter, -apple-system, 'Segoe UI', sans-serif"
        font-weight="800" font-size="96" letter-spacing="-3">YSpace</text>

  <!-- Kicker -->
  <text x="80" y="380" fill="#0A72EF"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-weight="600" font-size="22" letter-spacing="3">PERSONAL · PORTAL</text>

  <!-- Tagline -->
  <text x="80" y="440" fill="rgba(255,255,255,0.92)"
        font-family="Inter, -apple-system, sans-serif"
        font-weight="600" font-size="38">Hello, I'm YANG Guang.</text>
  <text x="80" y="488" fill="rgba(255,255,255,0.65)"
        font-family="Inter, -apple-system, sans-serif"
        font-weight="400" font-size="26">Websites · Content · AI — learning in public.</text>

  <!-- Footer line -->
  <line x1="80" y1="550" x2="1120" y2="550" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="80" y="585" fill="rgba(255,255,255,0.5)"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-weight="500" font-size="18" letter-spacing="1">yeranyang.com</text>
  <text x="1120" y="585" text-anchor="end" fill="rgba(255,255,255,0.5)"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-weight="500" font-size="18" letter-spacing="1">since 2016</text>
</svg>
