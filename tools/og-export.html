<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OG Cover PNG Exporter — YSpace</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', sans-serif; padding: 32px; max-width: 860px; margin: 0 auto; color: #222; }
  h1 { margin-top: 0; }
  .hint { color: #666; line-height: 1.6; font-size: 14px; }
  canvas { display: block; margin: 24px 0; border: 1px solid #e5e5e5; max-width: 100%; height: auto; }
  button { padding: 10px 18px; font-size: 14px; border-radius: 6px; border: 1px solid #0A72EF; background: #0A72EF; color: #fff; cursor: pointer; }
  button:hover { background: #005fd1; }
  code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
  <h1>OG Cover PNG Exporter</h1>
  <p class="hint">
    这是一个**一次性本地工具**，不是网站页面，不会被部署。<br>
    使用方式：在浏览器打开本文件 → 点击下方按钮 → 下载 <code>og-cover.png</code> → 手动放到 <code>/assets/images/og-cover.png</code>。<br>
    生成后即可删除本页。
  </p>

  <canvas id="cvs" width="1200" height="630"></canvas>
  <button id="dl">下载 og-cover.png（1200 × 630）</button>

  <script>
    const svgUrl = '/assets/images/og-cover.svg';
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => ctx.drawImage(img, 0, 0, 1200, 630);
    img.src = svgUrl;

    document.getElementById('dl').addEventListener('click', () => {
      cvs.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'og-cover.png';
        a.click();
      }, 'image/png');
    });
  </script>
</body>
</html>
